<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Import — maquette Control Panel Statamic 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F5F7FA; --card:#FFFFFF; --border:#E5E7EB; --border-strong:#D1D5DB; --text:#1F2937; --muted:#6B7280; --subtle:#F9FAFB; --hover:#F3F4F6;
  --sidebar:#FFFFFF; --accent:#2563EB; --accent-hover:#1D4ED8; --accent-soft:#EFF6FF; --accent-text:#1D4ED8; --on-accent:#FFFFFF;
  --pending:#6B7280; --pending-soft:#F3F4F6; --processing:#2563EB; --processing-soft:#EFF6FF;
  --ready:#16A34A; --ready-soft:#F0FDF4; --failed:#DC2626; --failed-soft:#FEF2F2; --committed:#14532D; --committed-soft:#DCFCE7;
  --warning:#B45309; --warning-soft:#FFFBEB; --changed:#FFFBEB; --overlay:rgba(17,24,39,.45);
  --ring:0 0 0 3px rgba(37,99,235,.40); --radius:8px; --shadow:0 10px 30px rgba(17,24,39,.12);
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0F1115; --card:#171A21; --border:#2A2F3A; --border-strong:#3A4150; --text:#E5E7EB; --muted:#9CA3AF; --subtle:#1C2029; --hover:#222734;
    --sidebar:#13161C; --accent:#3B82F6; --accent-hover:#60A5FA; --accent-soft:#172554; --accent-text:#93C5FD; --on-accent:#FFFFFF;
    --pending:#9CA3AF; --pending-soft:#1F2430; --processing:#60A5FA; --processing-soft:#172554;
    --ready:#4ADE80; --ready-soft:#052E16; --failed:#F87171; --failed-soft:#3B1013; --committed:#86EFAC; --committed-soft:#14301F;
    --warning:#FBBF24; --warning-soft:#33240A; --changed:#2A2310; --overlay:rgba(0,0,0,.6);
    --ring:0 0 0 3px rgba(96,165,250,.45); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F1115; --card:#171A21; --border:#2A2F3A; --border-strong:#3A4150; --text:#E5E7EB; --muted:#9CA3AF; --subtle:#1C2029; --hover:#222734;
  --sidebar:#13161C; --accent:#3B82F6; --accent-hover:#60A5FA; --accent-soft:#172554; --accent-text:#93C5FD; --on-accent:#FFFFFF;
  --pending:#9CA3AF; --pending-soft:#1F2430; --processing:#60A5FA; --processing-soft:#172554;
  --ready:#4ADE80; --ready-soft:#052E16; --failed:#F87171; --failed-soft:#3B1013; --committed:#86EFAC; --committed-soft:#14301F;
  --warning:#FBBF24; --warning-soft:#33240A; --changed:#2A2310; --overlay:rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(96,165,250,.45); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:hidden}
body{background:var(--page);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius);padding:8px 12px;transition:top .15s}
.skip:focus{top:12px}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
#sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar);border-right:1px solid var(--border);padding:14px 12px 160px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:15px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--text);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:14px}
.nav-sec{margin:14px 0 4px;padding:0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:6px;border:0;background:none;color:var(--text);text-decoration:none;font-size:13.5px;cursor:pointer;text-align:left;transition:background .15s}
.nav-item:hover{background:var(--hover)}
.nav-item svg{width:16px;height:16px;flex:none;color:var(--muted)}
.nav-item.child{padding-left:34px;font-size:13px}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-item[aria-current="page"] svg{color:var(--accent-text)}
.ai-sec{margin-top:16px;border:1px solid var(--border);border-radius:var(--radius);padding:8px 6px;background:linear-gradient(180deg,var(--accent-soft),transparent 70%)}
.ai-sec .nav-sec{margin:2px 0 6px;display:flex;align-items:center;gap:6px;color:var(--accent-text)}
.ai-sec .nav-sec svg{width:13px;height:13px}
.col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border)}
.btn.hamburger{display:none}
.crumbs{flex:1;min-width:0}
.crumbs ol{display:flex;align-items:center;gap:6px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs li{display:flex;align-items:center;gap:6px;min-width:0}
.crumbs li:last-child{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs li+li::before{content:"/";color:var(--border-strong)}
.top-actions{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.user{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--border)}
.avatar{width:30px;height:30px;border-radius:50%;background:#7C3AED;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.user-meta{line-height:1.2}
.user-meta b{display:block;font-size:13px;font-weight:600}
.user-meta span{font-size:11.5px;color:var(--muted)}
main{padding:24px clamp(16px,3vw,32px) 120px;max-width:1240px;width:100%;outline:none}
.overlay{display:none}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--failed)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:28px;padding:3px 9px;font-size:12.5px}
.btn-icon{min-height:30px;width:30px;padding:0}
a.btn{text-decoration:none}
.link{border:0;background:none;padding:0;color:var(--accent-text);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:500}
.input,.select,.textarea{width:100%;min-height:36px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--card);color:var(--text);transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.input[aria-invalid="true"],.textarea[aria-invalid="true"],.select[aria-invalid="true"],.rte[aria-invalid="true"]{border-color:var(--failed)}
.textarea{resize:vertical;min-height:80px}
.mono{font-family:var(--mono);font-size:12.5px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.req{color:var(--failed)}
.help{font-size:12px;color:var(--muted);margin:0}
.ferr{font-size:12px;color:var(--failed);margin:0;display:flex;gap:5px;align-items:flex-start}
.ferr:empty{display:none}
.ferr svg{width:13px;height:13px;flex:none;margin-top:2px}
.cnt{font-size:11.5px;color:var(--muted);margin-left:auto;font-weight:500}
.cnt.over{color:var(--failed);font-weight:600}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:500;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}

/* Cards & layout */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card+.card{margin-top:16px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-head h2{font-size:15px;font-weight:600;margin:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:22px;line-height:1.25;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);max-width:720px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:var(--pending-soft);color:var(--pending)}
.st-processing{background:var(--processing-soft);color:var(--processing)}
.st-processing .dot{animation:pulse 1s infinite ease-in-out}
.st-ready{background:var(--ready-soft);color:var(--ready)}
.st-failed{background:var(--failed-soft);color:var(--failed)}
.st-committed{background:var(--committed-soft);color:var(--committed)}
.b-draft{background:var(--warning-soft);color:var(--warning)}
.b-ai{background:var(--accent-soft);color:var(--accent-text)}
.b-muted{background:var(--pending-soft);color:var(--muted)}
.b-ok{background:var(--ready-soft);color:var(--ready)}
.b-err{background:var(--failed-soft);color:var(--failed)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex:none}

/* Stepper */
.stepper{display:flex;list-style:none;margin:0 0 20px;padding:0;gap:8px;flex-wrap:wrap}
.stepper li{flex:1 1 150px;min-width:0}
.step{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--muted);text-align:left;font-size:13px;font-weight:500}
button.step{cursor:pointer}
button.step:hover{border-color:var(--accent)}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-strong);font-size:12px;font-weight:600;flex:none}
.step[data-state="current"]{border-color:var(--accent);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.step[data-state="current"] .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step[data-state="done"]{color:var(--text)}
.step[data-state="done"] .num{background:var(--ready-soft);border-color:var(--ready);color:var(--ready)}
.step .num svg{width:13px;height:13px}

/* Dropzone */
.dropzone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 20px;border:1.5px dashed var(--border-strong);background:var(--subtle);transition:border-color .15s,background .15s}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);color:var(--accent)}
.dz-icon svg{width:22px;height:22px}
.dropzone h2{font-size:15px;margin:4px 0 0}
.dz-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* Tables */
.table-wrap{position:relative;overflow-x:auto;margin:0 -20px;padding:0 20px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.fname{display:flex;gap:8px;align-items:flex-start;min-width:200px}
.fname svg{width:18px;height:18px;flex:none;color:var(--muted);margin-top:1px}
.fname b{font-weight:500;word-break:break-all}
.row-err{color:var(--failed);font-size:12px;margin-top:3px}
.progress{height:6px;border-radius:999px;background:var(--pending-soft);overflow:hidden;width:120px}
.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .2s linear}
.progress.done span{background:var(--ready)}
.progress.fail span{background:var(--failed)}
.prog-cell{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:38px}
.actions{display:flex;gap:2px;justify-content:flex-end}
.counter{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:2px 10px;border-radius:999px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--border-strong)}
.empty h3{color:var(--text);font-size:14.5px;margin:8px 0 4px}
.empty p{margin:0 auto;max-width:440px}

/* Combobox */
.combo{position:relative;min-width:220px}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);max-height:220px;overflow:auto}
.combo-list li{padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--accent-soft);color:var(--accent-text)}
.combo-list .none{color:var(--muted);cursor:default}
.target-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.ok-text{color:var(--ready);display:inline-flex;align-items:center;gap:4px;font-weight:500}
.ok-text svg{width:13px;height:13px}
.warn-text{color:var(--warning)}

/* Article cards */
.preview-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.acard{padding:0;overflow:hidden;transition:opacity .2s}
.acard+.acard{margin-top:16px}
.acard.excluded .acard-body{opacity:.5}
.acard-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--subtle)}
.acard-head .src{font-size:12px;color:var(--muted);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard-body{padding:18px 20px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.span-2{grid-column:span 2}
.slug-note{font-size:12px;color:var(--warning);display:flex;gap:5px;align-items:center}
.slug-note:empty{display:none}
.rte-wrap{border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:var(--card)}
.rte-wrap:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.rte-wrap.invalid{border-color:var(--failed)}
.toolbar{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--border);background:var(--subtle)}
.toolbar .btn{min-height:28px;width:30px;padding:0}
.rte{min-height:140px;max-height:360px;overflow:auto;padding:10px 12px;outline:none;font-size:13.5px}
.rte:focus-visible{box-shadow:none}
.rte p{margin:0 0 8px}.rte ul,.rte ol{margin:0 0 8px;padding-left:22px}.rte h3{font-size:14px;margin:6px 0}
.linkpop{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--border);background:var(--subtle);flex-wrap:wrap}
.linkpop .input{flex:1;min-width:160px;min-height:30px;padding:4px 8px}
.notice{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);margin-top:6px}
.notice svg{width:13px;height:13px;flex:none;margin-top:2px;color:var(--ready)}
.notice.warn svg{color:var(--warning)}
.img-ph{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--border-strong);border-radius:6px;background:var(--subtle);color:var(--muted);font-size:12.5px}
.img-ph .thumb{width:56px;height:40px;border-radius:4px;background:var(--hover);display:grid;place-items:center;flex:none}
.img-ph svg{width:18px;height:18px}
.err-sum{font-size:12px}
.confirm-bar{position:sticky;bottom:12px;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.confirm-bar .msg{flex:1;min-width:200px;font-size:13px}
.confirm-bar .msg.bad{color:var(--failed)}

/* Prepare + checker */
.prep-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.prompt-view{margin:0;padding:14px 16px;border:1px solid var(--border);border-radius:6px;background:var(--subtle);max-height:460px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.prep-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn.copied{border-color:var(--ready);color:var(--ready)}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.how li::marker{color:var(--accent-text);font-weight:600}
.locked{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.locked svg{width:13px;height:13px}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chk-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--card)}
.chk-item.is-error{border-color:color-mix(in srgb,var(--failed) 45%,var(--border))}
.chk-item.is-warn{border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}
.chk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk-head svg{width:18px;height:18px;color:var(--muted);flex:none}
.chk-head b{font-weight:500;word-break:break-all;min-width:0}
.chk-head .size{font-size:12px;color:var(--muted);margin-right:auto}
.chk-rows{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px 16px}
.chk-row{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.chk-row .ico{width:16px;height:16px;flex:none;display:grid;place-items:center;margin-top:1px}
.chk-row .ico svg{width:15px;height:15px}
.chk-row.ok{color:var(--text)}.chk-row.ok .ico{color:var(--ready)}
.chk-row.warn .ico,.chk-row.warn .det{color:var(--warning)}
.chk-row.error .ico,.chk-row.error .det{color:var(--failed)}
.chk-row.error,.chk-row.warn{color:var(--text)}
.chk-row .det{display:block;font-size:11.5px;color:var(--muted)}
.chk-summary{font-size:13px;margin:0 0 12px;color:var(--muted)}
.chk-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.chk-foot .help{flex:1;min-width:200px}
@media (max-width:1080px){.prep-grid{grid-template-columns:1fr}}

/* OPCVM */
.funds{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.funds h3{font-size:13px;margin:0 0 6px}
.fmt{padding:0;overflow:hidden}
.fmt+.fmt{margin-top:16px}
.fmt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--subtle)}
.fmt-head h3{font-size:14px;margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fmt-head .sp{flex:1}
.fmt-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;padding:16px 20px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.tlist li{display:flex;gap:7px;align-items:flex-start}
.tlist svg{width:15px;height:15px;color:var(--ready);flex:none;margin-top:1px}
.ba{margin-top:12px;display:grid;gap:6px;font-size:12px}
.ba div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ba b{width:52px;flex:none;color:var(--muted);font-weight:600}
.ba code{font-family:var(--mono);background:var(--subtle);border:1px solid var(--border);border-radius:4px;padding:2px 6px;word-break:break-all}
.mini{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.mini th,.mini td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini th{font-family:var(--font);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.mini .gap td{text-align:center;color:var(--muted);font-family:var(--font)}
.mini tr.new td{background:var(--ready-soft)}
.bk-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.pills button{padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}
.chart{width:100%;height:auto;display:block;border:1px solid var(--border);border-radius:6px;background:var(--card)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.locales{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;padding:3px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card)}
.locales .check{font-size:12.5px;gap:5px}
.diff tr.grp td{background:var(--subtle);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 10px}
.report{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:var(--subtle)}
.report .rep-meta{flex:1;min-width:220px;font-size:13px;display:grid;gap:3px}
.report .rep-actions{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:900px){.fmt-body{grid-template-columns:minmax(0,1fr)}}

/* Diff */
.diff td{vertical-align:middle}
.diff tr.changed td{background:var(--changed)}
.diff tr.same td{opacity:.6}
.diff tr.same td:last-child{opacity:1}
.diff .cur{color:var(--muted);white-space:nowrap}
.diff .fl b{font-weight:500;display:block}
.diff .fl small{color:var(--muted);font-size:11.5px}
.diff .input{min-height:32px;padding:5px 8px;min-width:150px}
.diff .tag{margin-left:6px}
.diff-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.diff-head h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.diff-head .arrow{color:var(--muted);font-weight:400}
.diff-head .sp{flex:1}

/* Success */
.success{text-align:center;padding:32px 20px}
.success .big{width:52px;height:52px;border-radius:50%;background:var(--ready-soft);color:var(--ready);display:grid;place-items:center;margin:0 auto 10px}
.success .big svg{width:26px;height:26px}
.success h2{font-size:18px;margin:0 0 4px}
.created{list-style:none;padding:0;margin:18px auto 20px;max-width:640px;text-align:left;border:1px solid var(--border);border-radius:var(--radius)}
.created li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.created li:last-child{border-bottom:0}
.created .meta{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* Settings */
.tool-switch{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);text-decoration:none;font-size:13px;font-weight:500}
.pill[aria-current="page"]{background:var(--text);color:var(--card);border-color:var(--text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
.prompt-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.prompt-ta{min-height:440px}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--subtle);color:var(--accent-text);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip-ro{cursor:default;color:var(--text);font-family:var(--font);font-weight:600}
.ph-desc{font-size:12px;color:var(--muted);margin:3px 0 0}
details.schema{border:1px solid var(--border);border-radius:var(--radius);margin-top:14px;background:var(--subtle)}
details.schema summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13px}
details.schema pre{margin:0;padding:12px 14px;border-top:1px solid var(--border);max-height:320px;overflow:auto;background:var(--card)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dirty{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warning);font-weight:500}
.dirty .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.clean{font-size:12.5px;color:var(--muted)}
.test-panel{margin-top:16px}
.test-steps{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.test-steps li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.test-steps li.done{color:var(--text)}
.test-steps li.done svg{color:var(--ready);width:14px;height:14px}
pre.json{margin:0;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:var(--subtle);max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:820px}
.key-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--subtle)}
.key-box code{font-family:var(--mono);font-size:13px;letter-spacing:.02em}
.types{display:flex;gap:6px;flex-wrap:wrap}

/* Modal, toast, dev */
.modal-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:80;animation:fade .15s ease-out}
.modal{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);animation:pop .18s ease-out}
.modal h2{font-size:16px;margin:0;padding:18px 20px 0}
.modal .mbody{padding:10px 20px 4px;color:var(--text)}
.modal .mbody ul{padding-left:18px;margin:8px 0}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--ready);border-radius:var(--radius);box-shadow:var(--shadow);font-size:13px;animation:pop2 .2s ease-out}
.toast.error{border-left-color:var(--failed)}.toast.info{border-left-color:var(--accent)}
.toast p{margin:0;flex:1}
.toast .btn{min-height:22px;width:22px;padding:0;border:0}
@keyframes pop2{from{opacity:0;transform:translateY(6px)}}
#dev{position:fixed;left:12px;bottom:12px;z-index:60;width:228px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);font-size:12.5px}
#dev summary{cursor:pointer;padding:8px 12px;font-weight:600;display:flex;align-items:center;gap:6px;list-style:none}
#dev summary::-webkit-details-marker{display:none}
#dev summary .tag{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--warning-soft);color:var(--warning);font-weight:600}
#dev .dev-body{padding:4px 12px 12px;border-top:1px solid var(--border)}
#dev fieldset{border:0;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
#dev legend{font-weight:600;margin-bottom:4px;padding:0}
#dev .check{font-weight:400;font-size:12.5px;align-items:flex-start}
#dev .check input{margin-top:2px}

@media (max-width:1080px){.prompt-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;width:280px;transform:translateX(-102%);transition:transform .2s ease-out;box-shadow:var(--shadow)}
  body.nav-open #sidebar{transform:none}
  body.nav-open .overlay{display:block;position:fixed;inset:0;background:var(--overlay);z-index:65}
  .btn.hamburger{display:inline-flex}
  .topbar{padding:0 12px}
  .user-meta{display:none}
  .acard-body{grid-template-columns:minmax(0,1fr)}
  .span-6,.span-4,.span-3,.span-2{grid-column:auto}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  #dev{width:200px}
}
@media (max-width:560px){
  .crumbs li:not(:last-child){display:none}
  .crumbs li+li::before{display:none}
  .created li{flex-wrap:wrap}
  .created .meta{margin-left:0;width:100%;white-space:normal}
  main{padding-top:16px}
  .page-head h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<button class="skip" type="button" data-action="skip" id="skip"></button>
<div class="app">
  <aside id="sidebar" aria-label=""></aside>
  <div class="overlay" data-action="close-nav"></div>
  <div class="col">
    <header class="topbar" id="topbar"></header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<details id="dev" open></details>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="modal-root"></div>

      if (!ALLOWED[tag]) { removed++; walk(node, dst); continue; }
      const el = document.createElement(ALLOWED[tag]);
      for (const attr of [...node.attributes]) {
        if (tag === 'A' && attr.name === 'href' && /^https?:\/\//i.test(attr.value.trim())) {
          el.setAttribute('href', attr.value.trim()); el.setAttribute('rel', 'noopener noreferrer'); el.setAttribute('target', '_blank');
        } else { removed++; }
      }
      walk(node, el);
      dst.appendChild(el);
    }
  })(doc.body, out);
  return { html: out.innerHTML, removed, text: out.textContent.trim() };
}

  const labels = ['step_upload', 'step_processing', 'step_preview', 'step_confirm'];

function addToChecker(items) {

    const ext = (it.name.split('.').pop() || '').toLowerCase();
    // Final verdict per check, revealed one by one to simulate the checker.
    const plan = [];
    plan.push(ext === 'pdf' ? { status:'ok' } : { status:'error', detail:'chk_det_format', vars:{ ext } });
    plan.push(it.size <= max * 1048576 ? { status:'ok' } : { status:'error', detail:'chk_det_size', vars:{ size:fmtSize(it.size) } });
    plan.push(it.size > 0 ? { status:'ok' } : { status:'error', detail:'chk_det_empty' });

    c.results[i] = res;
    const el = $(`#chk-${c.id}`); if (el) el.outerHTML = checkItem(c);

}

/* -------- files: add, samples, processing */
function addFiles(tool, list) {
  if (tool === 'opcvm') { opcvmAddToChecker([...list].map((f) => ({ name:f.name, size:f.size }))); return; }
  if (tool === 'lettre') { addToChecker([...list].map((f) => ({ name:f.name, size:f.size }))); return; }
  const T = state.tools[tool];
  const allowed = tool === 'lettre' ? ['pdf'] : ['pdf', 'xlsx'];
  const max = state.settings[tool].saved.maxMb;
  let added = 0;
  for (const file of list) {
    if (T.files.length >= 20) { toast(t('too_many'), 'error'); break; }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!allowed.includes(ext)) { toast(t('rejected_type', { name:file.name, types:allowed.map((x) => '.' + x).join(', ') }), 'error'); continue; }
    const f = { id:uid('f'), name:file.name, size:file.size, status:'pending', progress:0, error:null };
    if (file.size > max * 1048576) { f.status = 'failed'; f.rejected = true; f.error = { key:'err_too_large', vars:{ max } }; }
    if (tool === 'lettre') { f.articles = [T.poolCursor % ARTICLE_POOL.length, (T.poolCursor + 1) % ARTICLE_POOL.length]; T.poolCursor += 2; }
    else { const s = suggestEntry(file.name); f.suggest = s?.id || null; f.conf = s?.conf || 0; f.target = f.suggest; f.targetConfirmed = false; }
    T.files.push(f); added++;
  }
  if (added) { toast(t('files_added', { n:added })); rerenderTool(tool); }
}
function suggestEntry(name) {
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !['atlas', 'fonds', 'opcvm', 'xlsx', 'pdf'].includes(w));
  const words = new Set(norm(name));
  let best = null;
  for (const e of state.entries) {
    const ew = norm(e.title);
    if (!ew.length) continue;
    const hit = ew.filter((w) => words.has(w) || [...words].some((x) => x.startsWith(w.slice(0, 5)))).length / ew.length;
    if (hit >= 0.5 && (!best || hit > best.score)) best = { id:e.id, score:hit };
  }
  return best ? { id:best.id, conf:Math.round(55 + best.score * 40) } : null;
}
function loadSamples(tool) {
  if (tool === 'opcvm') { opcvmLoadSamples(); return; }
  if (tool === 'lettre') {
    const T = state.tools.lettre;
    const fresh = SAMPLE_LETTRE.filter((s) => !T.checks.some((c) => c.name === s.name) && !T.files.some((f) => f.name === s.name));
    if (!fresh.length) { toast(t('samples_already'), 'info'); return; }
    addToChecker(fresh.map((s) => ({ ...s, sample:true })));
    toast(t('samples_loaded'));
    return;
  }
  const T = state.tools[tool];
  const samples = tool === 'lettre' ? SAMPLE_LETTRE : SAMPLE_OPCVM;
  if (samples.every((s) => T.files.some((f) => f.name === s.name))) { toast(t('samples_already'), 'info'); return; }
  for (const s of samples) {
    if (T.files.some((f) => f.name === s.name)) continue;
    const f = { id:uid('f'), name:s.name, size:s.size, status:'pending', progress:0, error:null, fail:!!s.fail, sample:true };
    if (tool === 'lettre') f.articles = s.articles || [];
    else { f.suggest = s.suggest; f.conf = s.conf; f.target = s.suggest; f.targetConfirmed = false; f.ai = s.ai; }
    T.files.push(f);
  }
  toast(t('samples_loaded'));
  rerenderTool(tool);
}
function viewBody(tool) {
  const v = state.tools[tool].view;
  if (tool === 'lettre') return { prepare:prepareView, upload:importView, processing:processingView, preview:previewView, done:doneView }[v](tool);
  return { prepare:prepareView, upload:opcvmImportView, format:opcvmFormatView, backup:opcvmBackupView, update:opcvmUpdateView, done:doneView }[v](tool);
}
function rerenderTool(tool) { if (currentTool() === tool && !route().startsWith('settings')) { $('#tool-body').innerHTML = viewBody(tool); updateChrome(tool); afterRender(); } }

function runImport(tool) {
  const T = state.tools[tool];
  const queue = T.files.filter((f) => f.status === 'pending' && (tool !== 'opcvm' || f.targetConfirmed));
  if (!queue.length) { toast(t('run_none'), 'info'); return; }
  T.batch = { ids:queue.map((f) => f.id) };
  toast(t('queue_started', { n:queue.length }), 'info');
  queue.forEach((f, i) => later(() => processFile(tool, f), i * 350));
  updateChrome(tool);
}
function processFile(tool, f) {
  const T = state.tools[tool];
  if (!T.files.includes(f)) return;
  f.status = 'processing'; f.progress = 0; f.error = null;
  updateRow(tool, f.id); updateChrome(tool);
  announce(t('live_status', { name:f.name, status:t('status_processing') }));
  const duration = 1500 + Math.random() * 2500;
  const start = performance.now();
  const id = every(() => {
    const p = Math.min(1, (performance.now() - start) / duration);
    f.progress = Math.round(p * 100);
    const bar = $(`#prog-${f.id}`);
    if (bar) { bar.firstElementChild.style.width = `${f.progress}%`; bar.setAttribute('aria-valuenow', f.progress); $(`#pct-${f.id}`).textContent = `${f.progress} %`; }
    if (p >= 1) { stop(id); finishFile(tool, f); }
  }, 120);
}
function finishFile(tool, f) {
  const T = state.tools[tool];
  if (!T.files.includes(f)) return;
  if (f.fail) { f.status = 'failed'; f.error = { key:'err_pdf' }; }
  else {
    f.status = 'ready';
    if (tool === 'lettre' && !f.cards) f.cards = f.articles.map((i) => makeCard(ARTICLE_POOL[i], f));
    if (tool === 'opcvm') f.diff = makeDiff(f);
  }
  updateRow(tool, f.id); updateChrome(tool);
  if (tool === 'opcvm') refreshFormatResults();
  announce(t('live_status', { name:f.name, status:t('status_' + f.status) }));
  if (T.batch && T.batch.ids.every((id) => { const x = T.files.find((y) => y.id === id); return !x || ['ready', 'failed', 'committed'].includes(x.status); })) {
    const ok = T.batch.ids.filter((id) => T.files.find((y) => y.id === id)?.status === 'ready').length;
    toast(t('all_done', { ok, ko:T.batch.ids.length - ok }), ok ? 'success' : 'error');
  }
}

function makeCard(a, f) {
  const clean = sanitize(a.content);
  return { uid:uid('a'), fileId:f.id, fileName:f.name, include:true, title:a.title, slug:'', slugManual:false, slugSuffixed:false, date:a.date,
    excerpt:a.excerpt, content:clean.html, removed:clean.removed, category:a.category, seo_title:a.seo_title || '', seo_description:a.seo_description || '', errors:{} };
}
function allCards() { return state.tools.lettre.files.filter((f) => f.status === 'ready').flatMap((f) => f.cards || []); }
function recomputeSlugs() {
  const taken = new Set([...EXISTING_SLUGS, ...state.createdSlugs]);
  for (const c of allCards()) {
    if (c.slugManual) { c.slugSuffixed = false; c.slugTaken = taken.has(c.slug); }
    else {
      const base = slugify(c.title);
      let s = base, n = 2;
      while (base && taken.has(s)) s = `${base}-${n++}`;
      c.slug = s; c.slugSuffixed = s !== base; c.slugTaken = false;
    }
    if (c.include && c.slug) taken.add(c.slug);
  }
}
function validateCard(c) {
  const e = {};
  if (!c.title.trim()) e.title = { key:'err_required' };
  if (!c.slug) e.slug = { key:'err_required' };
  else if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(c.slug)) e.slug = { key:'err_slug_format' };
  else if (c.slugTaken) e.slug = { key:'err_slug_taken' };
  if (!validDate(c.date)) e.date = { key:'err_date' };
  if (!c.excerpt.trim()) e.excerpt = { key:'err_required' };
  else if (c.excerpt.length > 300) e.excerpt = { key:'err_too_long', vars:{ n:c.excerpt.length, max:300 } };
  if (!sanitize(c.content).text) e.content = { key:'err_required' };
  if (!c.category) e.category = { key:'err_required' };
  if (c.seo_title.length > 60) e.seo_title = { key:'err_too_long', vars:{ n:c.seo_title.length, max:60 } };
  if (c.seo_description.length > 160) e.seo_description = { key:'err_too_long', vars:{ n:c.seo_description.length, max:160 } };
  c.errors = e;
  return e;
}

  return { included:inc.length, errors:errs, ok:inc.length > 0 && errs === 0, label:t('confirm_articles', { n:inc.length }),

function inputAttrs(c, f) { return `id="in-${c.uid}-${f}" data-input="card" data-uid="${c.uid}" data-field="${f}" aria-describedby="err-${c.uid}-${f}"`; }
function cardHtml(c) {

function opcvmAddToChecker(items) {

const fmtDateFr = (iso) => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

/* -------- values proposed by the AI for each fund */
function fakeAi(entry) {
  const num = (v) => parseFloat(String(v).replace(/[\s ]/g, '').replace(',', '.'));
  const pct = (v, d) => { const n = num(v); if (isNaN(n)) return v; const r = n + d; return `${r >= 0 ? '+' : ''}${r.toFixed(2).replace('.', ',')}`; };
  const out = { aum:frNum(num(entry.values.aum) * 1.006, 1) };
  for (let i = 1; i <= 5; i++) { out[`ftp_${i}y`] = i === 3 ? entry.values[`ftp_${i}y`] : pct(entry.values[`ftp_${i}y`], 0.21 * i); out[`idx_${i}y`] = i === 3 ? entry.values[`idx_${i}y`] : pct(entry.values[`idx_${i}y`], 0.17 * i); }
  return out;
}
function makeDiff(f) {
  const entry = state.entries.find((e) => e.id === f.target);
  const last = entry.full[entry.full.length - 1];
  const sample = f.sample && ACM_SAMPLE_AI[entry.id];
  const ai = { vl_date:last.date, vl:frNum(last.vl), ...(sample ? { aum:sample.aum } : {}) };
  if (sample) sample.ftp.forEach((v, i) => { ai[`ftp_${i + 1}y`] = v; }), sample.ind.forEach((v, i) => { ai[`idx_${i + 1}y`] = v; });
  else Object.assign(ai, fakeAi(entry));
  f.series = entry.full;
  const rows = {};
  for (const fd of OPCVM_FIELDS) {
    const current = entry.values[fd.key] ?? '';
    const aiv = ai[fd.key] ?? '';
    rows[fd.key] = { current, ai:aiv, accept:norm(current) !== norm(aiv) };
  }
  return { entryId:entry.id, rows };
}
function readyOpcvm() { return state.tools.opcvm.files.filter((f) => f.status === 'ready' && f.diff); }

/* -------- OPCVM step 4: backup + chart (guide step 3) */

function backupRow() {
  const B = state.tools.opcvm.backup;
  if (B?.state === 'done') return `<span class="ok-text">${I.check}${esc(t('bk_done', { date:B.date, ref:B.ref }))}</span>`;

}
function makeBackup() {
  const T = state.tools.opcvm;
  T.backup = { state:'running' };
  $('#bk-row').innerHTML = backupRow();
  later(() => {
    const now = new Date();
    const pad = (x) => String(x).padStart(2, '0');
    T.backup = { state:'done', date:now.toLocaleString(state.lang === 'fr' ? 'fr-FR' : 'en-GB', { dateStyle:'short', timeStyle:'short' }),
      ref:`rev-opcvm-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}` };
    const row = $('#bk-row'); if (row) row.innerHTML = backupRow();
    updateChrome('opcvm'); toast(t('bk_toast')); announce(t('bk_toast'));

}
function chartBlock() {
  const f = findFund(state.tools.opcvm.chartFund); if (!f) return '';
  const entry = state.entries.find((e) => e.id === f.target);
  const cut = entry.series[entry.series.length - 1].date;
  const pts = f.series;
  const fresh = pts.filter((p) => p.date > cut);
  const pills = `<div class="pills" role="group" aria-label="${esc(t('chart_fund'))}">${readyOpcvm().map((x) => `<button type="button" data-action="chart-fund" data-id="${x.id}" aria-pressed="${x.id === f.id}">${esc(entryTitle(x.target))}</button>`).join('')}</div>`;
  return `${pills}${chartSvg(entry, pts, cut, fresh.length)}
    <div class="legend"><span><i style="background:var(--accent)"></i>${esc(t('chart_vl'))}</span><span><i style="background:var(--muted)"></i>${esc(t('chart_idx', { idx:entry.idx }))}</span>
      <span><i style="background:var(--ready)"></i>${esc(fresh.length ? t('chart_new', { n:fresh.length, from:fresh[0].date, to:fresh[fresh.length - 1].date }) : t('chart_new_zone'))}</span></div>`;
}
function chartSvg(entry, pts, cut, nNew) {
  const W = 760, H = 250, L = 46, R = 12, T = 14, B = 28;
  const vl0 = pts[0].vl, ix0 = pts[0].idx;
  const a = pts.map((p) => p.vl / vl0 * 100), b = pts.map((p) => p.idx / ix0 * 100);
  const lo = Math.min(...a, ...b), hi = Math.max(...a, ...b), span = (hi - lo) || 1;
  const x = (i) => L + (i / (pts.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - (lo - span * 0.05)) / (span * 1.1)) * (H - T - B);
  const path = (arr, from = 0, to = arr.length) => arr.slice(from, to).map((v, i) => `${i ? 'L' : 'M'}${x(i + from).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ci = pts.findIndex((p) => p.date > cut); const cx = ci > 0 ? x(ci - 1) : x(pts.length - 1);
  const grid = [0, 0.25, 0.5, 0.75, 1].map((k) => { const v = lo + span * k; return `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" style="stroke:var(--border)" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" style="fill:var(--muted)" font-size="10">${v.toFixed(span < 8 ? 1 : 0)}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('chart_label', { fund:entry.title, idx:entry.idx, n:nNew }))}">
    ${grid}
    ${ci > 0 ? `<rect x="${cx.toFixed(1)}" y="${T}" width="${(W - R - cx).toFixed(1)}" height="${H - T - B}" style="fill:var(--ready-soft)"/>
    <line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${T}" y2="${H - B}" style="stroke:var(--ready)" stroke-dasharray="4 3"/>` : ''}
    <path d="${path(b)}" fill="none" style="stroke:var(--muted)" stroke-width="1.4"/>
    <path d="${path(a)}" fill="none" style="stroke:var(--accent)" stroke-width="1.8"/>
    ${ci > 0 ? `<path d="${path(a, ci - 1)}" fill="none" style="stroke:var(--ready)" stroke-width="2.6"/>` : ''}
    <text x="${L}" y="${H - 8}" style="fill:var(--muted)" font-size="10">${esc(pts[0].date)}</text>
    ${ci > 0 ? `<text x="${(cx - 4).toFixed(1)}" y="${T + 10}" text-anchor="end" style="fill:var(--ready)" font-size="10" font-weight="600">${esc(t('chart_new_zone'))} →</text>` : ''}
    <text x="${W - R}" y="${H - 8}" text-anchor="end" style="fill:var(--ready)" font-size="10" font-weight="600">${esc(pts[pts.length - 1].date)}</text>
  </svg>`;
}

/* -------- OPCVM step 5: update FR + EN entries (guide step 4) */

}
function diffCard(f) {
  const entry = state.entries.find((e) => e.id === f.diff.entryId);
  let lastGroup = null;
  const rows = OPCVM_FIELDS.map((fd) => {
    const r = f.diff.rows[fd.key];
    const label = fieldLabel(fd);
    const grp = fd.group !== lastGroup ? `<tr class="grp"><td colspan="4">${esc(t('group_' + fd.group))}</td></tr>` : '';

    return `${grp}<tr id="dr-${f.id}-${fd.key}">

        <input class="input mono" type="text" value="${esc(r.ai)}" data-input="diff" data-id="${f.id}" data-key="${fd.key}" id="dv-${f.id}-${fd.key}" aria-label="${esc(t('ai_value_for', { field:label }))}" aria-describedby="de-${f.id}-${fd.key}" spellcheck="false">

  return `<section class="card" id="sec-${f.id}" aria-labelledby="dh-${f.id}">
    <div class="diff-head"><h2 id="dh-${f.id}">${I.sheet.replace('<svg', '<svg width="16" height="16"')}<span>${esc(f.sheet)}</span> <span class="arrow">→</span> <span>${esc(entry.title)}</span></h2>
      <span class="sp"></span>
      <span class="locales" role="group" aria-label="${esc(t('upd_apply'))}">${esc(t('upd_apply'))}
        <label class="check"><input type="checkbox" data-change="locale" data-id="${f.id}" data-locale="fr" ${f.locales.fr ? 'checked' : ''}> FR</label>

      <button type="button" class="btn btn-sm" data-action="accept-all" data-id="${f.id}">${esc(t('accept_all'))}</button>
      <button type="button" class="btn btn-sm" data-action="reject-all" data-id="${f.id}">${esc(t('reject_all'))}</button></div>
    <p class="ferr" id="loc-${f.id}"></p>
    <div class="table-wrap"><table class="tbl diff"><thead><tr>
      <th scope="col">${esc(t('col_field'))}</th><th scope="col">${esc(t('col_current'))}</th><th scope="col">${esc(t('col_ai'))}</th><th scope="col" style="text-align:center">${esc(t('col_accept'))}</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="report" id="rep-${f.id}">${reportBlock(f)}</div>
  </section>`;
}
function reportBlock(f) {
  const entry = state.entries.find((e) => e.id === f.target);
  const head = `<div class="rep-meta"><b>${esc(t('rep_title'))}</b><span class="help">${esc(t('rep_current', { name:entry.reporting }))}</span>`;
  if (f.report) {
    return `${head}<span class="ok-text">${I.check}${esc(t('rep_new', { name:f.report.name }))} · ${esc(fmtSize(f.report.size))}</span></div>
      <div class="rep-actions"><button type="button" class="btn btn-sm btn-danger" data-action="report-remove" data-id="${f.id}">${I.trash}${esc(t('rep_remove'))}</button></div>`;
  }
  return `${head}<span class="warn-text" style="font-size:12px">${esc(t('rep_keep'))}</span></div>
    <div class="rep-actions">
      <button type="button" class="btn btn-sm" data-action="report-pick" data-id="${f.id}">${I.upload}${esc(t('rep_upload'))}</button>
      <button type="button" class="btn btn-sm" data-action="report-sample" data-id="${f.id}">${I.spark}${esc(t('rep_sample'))}</button>
      <input type="file" class="sr-only" tabindex="-1" aria-hidden="true" id="rep-input-${f.id}" accept=".pdf,application/pdf" data-change="report-file" data-id="${f.id}" aria-label="${esc(t('rep_label', { fund:entry.title }))}">
    </div>`;
}
function refreshReport(f) { const el = $(`#rep-${f.id}`); if (el) el.innerHTML = reportBlock(f); refreshDiffs(); updateChrome('opcvm'); }
function diffSummary() {
  let x = 0, y = 0, errs = 0, reps = 0, locIssue = null;
  for (const f of readyOpcvm()) {
    let n = 0;
    for (const fd of OPCVM_FIELDS) { const r = f.diff.rows[fd.key]; if (r.accept) { n++; if (validateValue(fd.type, r.ai)) errs++; } }
    const contributes = n > 0 || f.report;
    if (f.report) reps++;
    if (contributes) { x += n; y++; if (!f.locales.fr && !f.locales.en) locIssue = locIssue || entryTitle(f.target); }
  }
  const ok = (x > 0 || reps > 0) && errs === 0 && !locIssue;
  return { x, y, reps, errors:errs, ok, label:t('confirm_fields', { x }),
    msg: !(x || reps) ? t('nothing_fields') : errs ? t('blocked_errors', { n:errs }) : locIssue ? t('no_locale', { fund:locIssue }) : t('fields_selected', { x, y }) };
}
function refreshDiffs() {
  for (const f of readyOpcvm()) {
    for (const fd of OPCVM_FIELDS) {
      const r = f.diff.rows[fd.key];
      const tr = $(`#dr-${f.id}-${fd.key}`); if (!tr) continue;
      const same = norm(r.current) === norm(r.ai);
      tr.classList.toggle('same', same); tr.classList.toggle('changed', !same);
      $(`#dt-${f.id}-${fd.key}`).hidden = !same;
      const e = r.accept ? validateValue(fd.type, r.ai) : null;
      const shown = validateValue(fd.type, r.ai);
      $(`#de-${f.id}-${fd.key}`).innerHTML = shown ? `${I.alert}<span>${esc(t(shown.key))}</span>` : '';
      $(`#dv-${f.id}-${fd.key}`).setAttribute('aria-invalid', e ? 'true' : 'false');
      const cb = tr.querySelector('.acc'); if (cb.checked !== r.accept) cb.checked = r.accept;
    }
    const loc = $(`#loc-${f.id}`);
    if (loc) loc.innerHTML = !f.locales.fr && !f.locales.en ? `${I.alert}<span>${esc(t('no_locale', { fund:entryTitle(f.target) }))}</span>` : '';
  }
  const s = diffSummary();
  const msg = $('#confirm-msg');
  if (msg) { msg.textContent = s.msg; msg.classList.toggle('bad', !s.ok); }
  for (const b of $$('#commit-head, #commit-bottom')) {
    b.disabled = !s.ok;
    if (b.id === 'commit-bottom') b.lastElementChild.textContent = s.label;
    else b.innerHTML = `${I.check}${esc(s.label)}`;
  }
}

/* -------- OPCVM step 6: confirmation */
function opcvmCommit() {
  const s = diffSummary(); if (!s.ok) return;
  const T = state.tools.opcvm;
  const lines = readyOpcvm().map((f) => ({ f, n:OPCVM_FIELDS.filter((fd) => f.diff.rows[fd.key].accept).length })).filter((o) => o.n || o.f.report);
  openModal({
    title:t('modal_fields_title'),
    body:`<p><strong>${esc(t('modal_fields_text', { x:s.x, y:s.y }))}</strong></p>
      <ul>${lines.map(({ f, n }) => `<li>${esc(t('modal_fields_line', { entry:entryTitle(f.target), n, locales:localesLabel(f.locales), rep:f.report ? t('modal_rep') : '' }))}</li>`).join('')}</ul>
      <p class="help">${esc(t('modal_chart', { state:T.chartUpdate ? t('chart_on') : t('chart_off') }))} ${esc(t('modal_backup', { ref:T.backup.ref }))}</p>`,
    confirm:t('confirm_fields', { x:s.x }),
    onConfirm:() => new Promise((res) => later(() => {
      T.created = lines.map(({ f, n }) => {
        const entry = state.entries.find((e) => e.id === f.diff.entryId);
        for (const fd of OPCVM_FIELDS) if (f.diff.rows[fd.key].accept) entry.values[fd.key] = String(f.diff.rows[fd.key].ai).trim();
        if (f.report) entry.reporting = f.report.name;
        if (T.chartUpdate) entry.series = entry.full;
        return { title:entry.title, n, locales:localesLabel(f.locales), rep:!!f.report, chart:T.chartUpdate };
      });
      T.createdTotals = { x:s.x, y:s.y, ref:T.backup.ref };
      T.files.forEach((f) => { if (f.status === 'ready') f.status = 'committed'; });
      T.view = 'done'; T.batch = null;
      res(); rerenderTool('opcvm'); focusMain();
      announce(t('done_fields_title'));
    }, 900))
  });
}

      <span class="meta">${esc([t('done_fields_line', { n:e.n, locales:e.locales }), e.rep ? t('done_rep') : '', e.chart ? t('done_chart') : ''].filter(Boolean).join(' · '))}</span></li>`).join('')}</ul>

/* -------- commit & done */
function commit(tool) {
  if (tool === 'opcvm') return opcvmCommit();
  if (tool === 'lettre') {
    const s = articleSummary(); if (!s.ok) return;
    const inc = allCards().filter((c) => c.include);

let modalState = null;
function openModal({ title, body, confirm, onConfirm, danger }) {

function closeModal() {
  if (!modalState) return;

  $('#modal-root').innerHTML = '';

  const ok = $('#modal-ok');
  ok.disabled = true; ok.innerHTML = `<span class="spinner" aria-hidden="true"></span>${esc(t('working'))}`;

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `<p></p><button type="button" class="btn btn-ghost" aria-label="${esc(t('close'))}">${I.x}</button>`;
  el.querySelector('p').textContent = msg;
  el.querySelector('button').addEventListener('click', () => el.remove());

}

  const id = input.dataset.id;

  const q = (filter ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const items = state.entries.filter((e) => e.title.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().includes(q));
  list.innerHTML = items.length
    ? items.map((e, i) => `<li role="option" id="opt-${id}-${i}" data-action="combo-pick" data-id="${id}" data-entry="${e.id}" aria-selected="${i === 0}">${esc(e.title)}</li>`).join('')

function comboMove(input, dir) {

  let i = opts.findIndex((o) => o.getAttribute('aria-selected') === 'true');

  opts.forEach((o, j) => o.setAttribute('aria-selected', String(i === j)));

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, tool = el.dataset.tool;
  switch (a) {
    case 'skip': $('#main').focus(); break;
    case 'stub': toast(t('out_of_scope', { item:el.dataset.label }), 'info'); closeNav(); break;
    case 'toggle-nav': document.body.classList.contains('nav-open') ? closeNav() : openNav(); break;
    case 'close-nav': closeNav(); break;
    case 'lang': state.lang = el.dataset.lang; renderAll(); $(`[data-action="lang"][data-lang="${state.lang}"]`)?.focus(); break;
    case 'theme': state.theme = effectiveDark() ? 'light' : 'dark'; applyTheme(); renderShell(); $('[data-action="theme"]').focus(); break;
    case 'reset-demo': timers.forEach((id) => stop(id)); closeModal(); state = initialState({ lang:state.lang, theme:state.theme }); if (location.hash !== '#lettre') location.hash = 'lettre'; else renderAll(); toast(t('toast_reset')); break;
    case 'pick': $('#file-input')?.click(); break;
    case 'samples': loadSamples(tool); break;
    case 'run': runImport(tool); break;
    case 'retry': { const f = state.tools[tool].files.find((x) => x.id === el.dataset.id); if (f) { state.tools[tool].batch = { ids:[f.id] }; f.status = 'pending'; processFile(tool, f); } break; }
    case 'remove': { const T = state.tools[tool]; const f = T.files.find((x) => x.id === el.dataset.id); if (!f) break; T.files = T.files.filter((x) => x !== f); if (T.batch) T.batch.ids = T.batch.ids.filter((id) => id !== f.id); if (T.batch && !T.batch.ids.length) T.batch = null; rerenderTool(tool); toast(t('removed', { name:f.name }), 'info'); $('[data-action="pick"]')?.focus(); break; }
    case 'view': if (tool === 'opcvm') { const el2 = $(`#fmt-${el.dataset.id}`); el2?.scrollIntoView({ behavior:reducedMotion() ? 'auto' : 'smooth', block:'start' }); el2?.querySelector('button')?.focus({ preventScroll:true }); break; } { state.tools[tool].view = 'preview'; rerenderTool(tool); const target = tool === 'lettre' ? $(`[data-file-ref="${el.dataset.id}"]`) : $(`#sec-${el.dataset.id}`); target?.scrollIntoView({ behavior:reducedMotion() ? 'auto' : 'smooth', block:'start' }); target?.querySelector('input,button')?.focus({ preventScroll:true }); break; }
    case 'go-preview': state.tools[tool].view = 'preview'; rerenderTool(tool); focusMain(); break;
    case 'back-files': state.tools[tool].view = tool === 'lettre' ? 'processing' : 'upload'; rerenderTool(tool); focusMain(); break;
    case 'goto': state.tools[tool].view = el.dataset.view; rerenderTool(tool); focusMain(); break;
    case 'to-processing': moveToProcessing(); break;
    case 'remove-check': { const T = state.tools.lettre; const c = T.checks.find((x) => x.id === el.dataset.id); T.checks = T.checks.filter((x) => x !== c); rerenderTool('lettre'); refreshChecker(); if (c) toast(t('removed', { name:c.name }), 'info'); $('[data-action="pick"]')?.focus(); break; }
    case 'o-to-format': opcvmMoveToFormat(); break;
    case 'remove-ocheck': { const T = state.tools.opcvm; const c = T.checks.find((x) => x.id === el.dataset.id); T.checks = T.checks.filter((x) => x !== c); rerenderTool('opcvm'); if (c) toast(t('removed', { name:c.name }), 'info'); $('[data-action="pick"]')?.focus(); break; }
    case 'copy-csv': { const f = findFund(el.dataset.id); if (f && await copyText(csvFor(f))) toast(t('csv_copied', { name:csvName(f) })); else toast(t('copy_failed'), 'error'); break; }
    case 'make-backup': makeBackup(); break;
    case 'chart-fund': state.tools.opcvm.chartFund = el.dataset.id; $('#chart-box').innerHTML = chartBlock(); $(`[data-action="chart-fund"][data-id="${el.dataset.id}"]`)?.focus(); break;
    case 'report-pick': $(`#rep-input-${el.dataset.id}`)?.click(); break;
    case 'report-sample': { const f = findFund(el.dataset.id); const e = state.entries.find((x) => x.id === f.target); f.report = { name:e.reporting.replace('octobre', 'novembre'), size:1468006 }; refreshReport(f); toast(t('rep_added', { name:f.report.name })); break; }
    case 'report-remove': { const f = findFund(el.dataset.id); f.report = null; refreshReport(f); break; }
    case 'copy-prompt': copyPrompt(tool || 'lettre'); break;
    case 'edit-prompt': break;
    case 'new-import': { const T = state.tools[tool]; T.files = T.files.filter((f) => !['committed'].includes(f.status)); T.view = 'upload'; T.checks = []; T.backup = null; T.chartUpdate = true; T.chartFund = null; T.created = null; T.batch = null; rerenderTool(tool); focusMain(); break; }
    case 'commit': commit(tool); break;
    case 'confirm-target': comboPick(el.dataset.id, findFund(el.dataset.id)?.target); break;
    case 'combo-pick': comboPick(el.dataset.id, el.dataset.entry); break;
    case 'accept-all': case 'reject-all': {
      const f2 = findFund(el.dataset.id); for (const fd of OPCVM_FIELDS) { const r = f2.diff.rows[fd.key]; r.accept = a === 'accept-all' ? norm(r.current) !== norm(r.ai) : false; }
      refreshDiffs(); updateChrome('opcvm'); break;
    }
    case 'slug-regen': { const c = findCard(el.dataset.uid); c.slugManual = false; refreshArticles(); $(`#in-${c.uid}-slug`).focus(); break; }
    case 'fmt': { const ed = editorFor(el.dataset.uid); ed.focus(); document.execCommand(el.dataset.cmd, false, null); syncEditor(el.dataset.uid, true); break; }
    case 'link-open': {
      const ed = editorFor(el.dataset.uid); const sel = window.getSelection();
      savedRange = sel.rangeCount && ed.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
      const pop = $(`#linkpop-${el.dataset.uid}`); pop.hidden = false; $(`#link-${el.dataset.uid}`).value = 'https://'; $(`#link-${el.dataset.uid}`).focus(); break;
    }
    case 'link-apply': applyLink(el.dataset.uid); break;
    case 'link-cancel': closeLink(el.dataset.uid); break;
    case 'image': toast(t('image_toast'), 'info'); break;
    case 'open-entry': toast(t('entry_toast', { title:el.dataset.title }), 'info'); break;
    case 'modal-cancel': closeModal(); break;
    case 'modal-confirm': confirmModal(); break;
    case 'tab': selectTab(tool, el.dataset.tab, false); break;
    case 'insert-ph': {
      const ta = $('#prompt-ta'); const p = el.dataset.ph;
      const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? ta.value.length;
      ta.value = ta.value.slice(0, s) + p + ta.value.slice(en);
      ta.focus(); ta.selectionStart = ta.selectionEnd = s + p.length;
      onPromptInput(tool, ta); announce(t('inserted', { ph:p })); break;
    }
    case 'reset-prompt':
      openModal({ title:t('reset_title'), body:`<p>${esc(t('reset_text'))}</p>`, confirm:t('reset_confirm'), onConfirm:() => {
        const S = state.settings[tool];
        S.draft.prompt = DEFAULT_PROMPTS[tool]; S.saved.prompt = DEFAULT_PROMPTS[tool];
        const ta = $('#prompt-ta'); if (ta) { ta.value = S.draft.prompt; $('#prompt-cnt').textContent = t('chars_count', { n:S.draft.prompt.length }); }
        updateDirty(tool); toast(t('reset_toast'));
      } });
      break;
    case 'test-prompt': runTest(tool); break;
    case 'test-close': state.settings[tool].test = null; $('#test-panel').innerHTML = ''; $('#test-btn')?.focus(); break;
    case 'save': {
      const errs = validateSettings(tool);
      if (Object.keys(errs).length) {
        toast(t('save_blocked'), 'error');
        const tab = errs.maxMb || errs.collection || errs.blueprint ? 'files' : 'provider';
        selectTab(tool, tab, false); validateSettings(tool); break;
      }
      const S = state.settings[tool];
      S.draft.maxMb = Number(S.draft.maxMb); S.saved = clone(S.draft); updateDirty(tool); toast(t('saved_toast')); break;
    }
    case 'key-edit': state.settings[tool].editingKey = true; $('#key-block').innerHTML = keyBlock(tool); $('#s-key').focus(); break;
    case 'key-cancel': state.settings[tool].editingKey = false; $('#key-block').innerHTML = keyBlock(tool); $('[data-action="key-edit"]').focus(); break;
    case 'key-apply': {
      const v = $('#s-key').value.trim();
      if (!/^sk-/.test(v) || v.length < 12) { $('#key-err').innerHTML = `${I.alert}<span>${esc(t('key_invalid'))}</span>`; $('#s-key').setAttribute('aria-invalid', 'true'); $('#s-key').focus(); break; }
      const S = state.settings[tool]; S.draft.keyLast4 = v.slice(-4); S.editingKey = false;
      $('#key-block').innerHTML = keyBlock(tool); $('[data-action="key-edit"]').focus(); updateDirty(tool); toast(t('key_updated'), 'info'); break;
    }
  }
});

function selectTab(tool, tab, focus) {
  state.settings[tool].tab = tab;
  for (const b of $$('[role="tab"]')) { const on = b.dataset.tab === tab; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); }
  for (const p of $$('[role="tabpanel"]')) p.hidden = p.id !== `panel-${tab}`;
}
function applyLink(id) {
  const input = $(`#link-${id}`); const url = input.value.trim();
  if (!/^https:\/\/[^\s]+\.[^\s]+$/i.test(url)) { $(`#linkerr-${id}`).innerHTML = `${I.alert}<span>${esc(t('link_invalid'))}</span>`; input.focus(); return; }
  const ed = editorFor(id); ed.focus();
  const sel = window.getSelection();
  if (savedRange) { sel.removeAllRanges(); sel.addRange(savedRange); }
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
  if (!sel.isCollapsed) document.execCommand('createLink', false, url);
  else document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`);
  closeLink(id, false); syncEditor(id, true);
}
function closeLink(id, refocus = true) { $(`#linkpop-${id}`).hidden = true; $(`#linkerr-${id}`).innerHTML = ''; savedRange = null; if (refocus) editorFor(id).focus(); }

function onPromptInput(tool, ta) {
  state.settings[tool].draft.prompt = ta.value;
  $('#prompt-cnt').textContent = t('chars_count', { n:ta.value.length });
  updateDirty(tool);
}
document.addEventListener('input', (e) => {
  const el = e.target;
  const kind = el.dataset?.input;
  if (!kind) return;
  if (kind === 'card') {
    const c = findCard(el.dataset.uid); if (!c) return;
    const f = el.dataset.field;
    c[f] = el.value;
    if (f === 'slug') c.slugManual = true;
    refreshArticles(); updateChrome('lettre');
  } else if (kind === 'rte') syncEditor(el.dataset.uid, false);
  else if (kind === 'diff') {
    const f = state.tools.opcvm.files.find((x) => x.id === el.dataset.id);
    f.diff.rows[el.dataset.key].ai = el.value; refreshDiffs();
  } else if (kind === 'combo') comboOpen(el, el.value);
  else if (kind === 'prompt') onPromptInput(el.dataset.tool, el);
  else if (kind === 'setting') { state.settings[el.dataset.tool].draft[el.dataset.key] = el.dataset.key === 'maxMb' ? (el.value === '' ? '' : Number(el.value)) : el.value; updateDirty(el.dataset.tool); validateSettings(el.dataset.tool); }
  else if (kind === 'link') $(`#linkerr-${el.dataset.uid}`).innerHTML = '';
});
document.addEventListener('change', (e) => {
  const el = e.target;
  const kind = el.dataset?.change;
  if (kind === 'role') {
    state.role = el.value;
    toast(t('role_changed', { role:roleLabel() }), 'info');
    if (route().startsWith('settings') && !canConfigure()) { toast(t('toast_forbidden'), 'error'); location.hash = 'lettre'; }
    else { renderShell(); if (route() === 'lettre' && state.tools.lettre.view === 'prepare') rerenderTool('lettre'); }
    $(`input[name="role"][value="${state.role}"]`)?.focus();
  } else if (kind === 'files') { addFiles(el.dataset.tool, [...el.files]); el.value = ''; }
  else if (kind === 'fund-include') { const f = findFund(el.dataset.id); f.include = el.checked; updateFundRow(f.id); refreshOChecker(); }
  else if (kind === 'fund-include-all') {
    const c = state.tools.opcvm.checks.find((x) => x.id === el.dataset.id);
    c.funds.forEach((f) => { f.include = el.checked; });
    $(`#ochk-${c.id}`).outerHTML = oCheckItem(c); refreshOChecker(); $(`#incall-${c.id}`)?.focus();
  }
  else if (kind === 'locale') { const f = findFund(el.dataset.id); f.locales[el.dataset.locale] = el.checked; refreshDiffs(); updateChrome('opcvm'); }
  else if (kind === 'chart-update') { state.tools.opcvm.chartUpdate = el.checked; }
  else if (kind === 'report-file') {
    const f = findFund(el.dataset.id); const file = el.files[0]; el.value = '';
    if (file) { if (!/\.pdf$/i.test(file.name)) toast(t('rep_pdf_only'), 'error'); else { f.report = { name:file.name, size:file.size }; refreshReport(f); toast(t('rep_added', { name:file.name })); } }
  }
  else if (kind === 'include') { const c = findCard(el.dataset.uid); c.include = el.checked; refreshArticles(); updateChrome('lettre'); }
  else if (kind === 'accept') { const f = state.tools.opcvm.files.find((x) => x.id === el.dataset.id); f.diff.rows[el.dataset.key].accept = el.checked; refreshDiffs(); updateChrome('opcvm'); }
  else if (kind === 'setting') {
    const S = state.settings[el.dataset.tool]; S.draft[el.dataset.key] = el.value;
    if (el.dataset.key === 'provider') { S.draft.model = MODELS[el.value][0]; $('#s-model').innerHTML = MODELS[el.value].map((m) => `<option ${S.draft.model === m ? 'selected' : ''}>${esc(m)}</option>`).join(''); }
    updateDirty(el.dataset.tool);
  } else if (el.dataset?.input === 'card' && el.tagName === 'SELECT') { const c = findCard(el.dataset.uid); c[el.dataset.field] = el.value; refreshArticles(); updateChrome('lettre'); }
});
document.addEventListener('focusin', (e) => { if (e.target.dataset?.input === 'combo' && !suppressComboOpen) { e.target.select(); comboOpen(e.target, ''); } });
document.addEventListener('focusout', (e) => {
  const el = e.target;
  if (el.dataset?.input === 'combo') later(() => { if (document.activeElement !== el) comboClose(el); }, 120);
  if (el.dataset?.input === 'rte') syncEditor(el.dataset.uid, true);
});

/* drag & drop */
document.addEventListener('dragover', (e) => { const dz = e.target.closest?.('[data-dropzone]'); if (dz) { e.preventDefault(); dz.classList.add('drag'); } });
document.addEventListener('dragleave', (e) => { const dz = e.target.closest?.('[data-dropzone]'); if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove('drag'); });
document.addEventListener('drop', (e) => {
  const dz = e.target.closest?.('[data-dropzone]');
  e.preventDefault();
  if (!dz) return;
  dz.classList.remove('drag');
  addFiles(dz.dataset.dropzone, [...(e.dataTransfer?.files || [])]);
});

/* keyboard */
document.addEventListener('keydown', (e) => {
  if (modalState) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab') trap(e, $('.modal'));
    return;
  }
  const el = e.target;
  if (el.dataset?.input === 'combo') {
    const list = $(`#lb-${el.dataset.id}`);
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) comboOpen(el, ''); else comboMove(el, 1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); comboMove(el, -1); return; }
    if (e.key === 'Enter' && !list.hidden) { e.preventDefault(); const opt = list.querySelector('[aria-selected="true"][data-entry]'); if (opt) comboPick(el.dataset.id, opt.dataset.entry); return; }
    if (e.key === 'Escape' && !list.hidden) { e.preventDefault(); comboClose(el); return; }
  }
  if (el.dataset?.input === 'link') {
    if (e.key === 'Enter') { e.preventDefault(); applyLink(el.dataset.uid); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeLink(el.dataset.uid); return; }
  }
  if (el.getAttribute?.('role') === 'tab') {
    const tabs = $$('[role="tab"]'); const i = tabs.indexOf(el); let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = tabs.length - 1;
    if (j !== null) { e.preventDefault(); selectTab(el.dataset.tool, tabs[j].dataset.tab, true); }
  }
  if (e.target.classList?.contains('rte') && (e.ctrlKey || e.metaKey) && ['b', 'i'].includes(e.key.toLowerCase())) { later(() => syncEditor(e.target.dataset.uid, true), 0); }
  if (document.body.classList.contains('nav-open')) {
    if (e.key === 'Escape') { closeNav(); $('.hamburger').focus(); }
    else if (e.key === 'Tab' && window.innerWidth <= 900) trap(e, $('#sidebar'), $('.hamburger'));
  }
});
function trap(e, container, extra) {
  const items = [...(extra ? [extra] : []), ...$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', container)].filter((x) => x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function openNav() { document.body.classList.add('nav-open'); $('.hamburger').setAttribute('aria-expanded', 'true'); $('.hamburger').setAttribute('aria-label', t('menu_close')); $('#sidebar .nav-item')?.focus(); }
function closeNav() { if (!document.body.classList.contains('nav-open')) return; document.body.classList.remove('nav-open'); const h = $('.hamburger'); h?.setAttribute('aria-expanded', 'false'); h?.setAttribute('aria-label', t('menu_open')); }

/* routing */
function guard() {
  if (route().startsWith('settings') && !canConfigure()) { toast(t('toast_forbidden'), 'error'); location.replace('#lettre'); return false; }
  return true;
}
window.addEventListener('hashchange', () => { if (!guard()) { renderAll(); return; } closeNav(); renderAll(); $('#main').focus({ preventScroll:true }); window.scrollTo(0, 0); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!state.theme) renderShell(); });
window.addEventListener('resize', () => { if (window.innerWidth > 900) closeNav(); });
if (!ROUTES.includes(location.hash.slice(1))) history.replaceState(null, '', '#lettre');
guard();
renderAll();
if (window.innerWidth <= 900) $('#dev').open = false; // keep the demo panel out of the way on phones
</script>
